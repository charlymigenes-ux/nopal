name: Smoke test

on:
  push:
    branches: [main, dev-main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements-dev.txt incluye requirements.txt (-r) más pytest,
      # pytest-asyncio y httpx -- un solo paso de instalación para los tests
      # y para el arranque del servidor.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Suite completa (pytest.ini fija testpaths=backend/tests). No necesita
      # hardware, servicios ni variables de entorno: los transportes están
      # simulados y conftest.py redirige los registros JSON a un tmp. Un test
      # fallido sale con código distinto de 0 y detiene el job aquí.
      - name: Run tests
        run: pytest -rf

      - name: Start NOPAL
        run: |
          mkdir -p uploads previews
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8420 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server and check health
        run: |
          for i in $(seq 1 20); do
            # /api/status requiere sesión; la portada es el health check
            # público que confirma que Uvicorn y la aplicación respondieron.
            if curl -sf http://127.0.0.1:8420/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond in time"
          cat server.log
          exit 1

      - name: Check homepage renders
        run: curl -sf http://127.0.0.1:8420/ | grep -q "NOPAL"

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
