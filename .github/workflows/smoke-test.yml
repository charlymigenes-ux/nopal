name: Smoke test

on:
  push:
    branches: [main, dev-main]
  pull_request:
    branches: [main]
  # Semanal (lunes 09:17 UTC): los plugins son repos aparte y cambian sin que
  # NOPAL haga push; también corre smoke-test, sin cambios en su definición.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # 3.9 es la versión mínima soportada (issue #22 / PR #24: Qidi Q2, MKS Pi
    # y otros equipos con Debian Bullseye). Sin fail-fast: si una versión
    # falla, la otra termina igual y se ve cuál es.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    name: smoke-test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # requirements-dev.txt incluye requirements.txt (-r) más pytest,
      # pytest-asyncio y httpx -- un solo paso de instalación para los tests
      # y para el arranque del servidor.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Suite completa (pytest.ini fija testpaths=backend/tests). No necesita
      # hardware, servicios ni variables de entorno: los transportes están
      # simulados y conftest.py redirige los registros JSON a un tmp. Un test
      # fallido sale con código distinto de 0 y detiene el job aquí.
      - name: Run tests
        run: pytest -rf

      - name: Start NOPAL
        run: |
          mkdir -p uploads previews
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8420 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server and check health
        run: |
          for i in $(seq 1 20); do
            # /api/status requiere sesión; la portada es el health check
            # público que confirma que Uvicorn y la aplicación respondieron.
            if curl -sf http://127.0.0.1:8420/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond in time"
          cat server.log
          exit 1

      - name: Check homepage renders
        run: curl -sf http://127.0.0.1:8420/ | grep -q "NOPAL"

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  # Plugins del catálogo en Python 3.9 (versión mínima de NOPAL). Check propio:
  # un plugin roto no pone en rojo smoke-test. Prueba la punta de la rama por
  # defecto de cada repo_url (lo que instala la Galería) y anota el SHA
  # probado. COMPAT hace fallar el job; INFRA (repo inaccesible tras 3
  # intentos) queda como aviso. Lógica en scripts/check_plugins_compat.py.
  plugins-compat:
    name: plugins-compat (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Los tests de contrato de font-library y svg-toolkit usan `node --check`.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Mismas dependencias que NOPAL. pypixelcolor lo pide matriz-led aparte
      # (su README: `pip install pypixelcolor`, sin versión fija): se instala
      # igual que lo haría un usuario.
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install pypixelcolor

      - name: Check plugins
        run: |
          python --version
          python scripts/check_plugins_compat.py --workdir "$RUNNER_TEMP/nopal-plugins"
